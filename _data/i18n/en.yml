support:
  title: Support
  description: Fund the developers who keep abandoned software running.
  platforms_heading: Choose a platform
  pays_for_heading: Your donation pays for
  pays_for:
    - Developer time on emulators and server code
    - Protocol and file-format research
    - Modding tools and documentation
  not_for_heading: It does not pay for
  not_for:
    - Running public servers
    - Software access, in-game items or other perks
  faq_heading: Before you give
  faq:
    - question: Is ILPAL a non-profit?
      answer_html: "ILPAL is intended to operate as a non-profit. [LEGAL STATUS AND COUNTRY]. Don't assume your donation is tax-deductible unless this page says so."
    - question: Is ILPAL tied to the original publishers?
      answer_html: No. ILPAL is independent and isn't affiliated with the rights holders of the software it studies.
    - question: Who runs ILPAL?
      answer_html: See the %about% for the team, legal status and how funds are used.
    - question: Can I help without donating?
      answer_html: Yes. Code, testing and documentation all help. Start with the %github%.

