support:
  title: Ủng hộ
  description: Ủng hộ các lập trình viên giúp phần mềm bị bỏ rơi tiếp tục hoạt động.
  platforms_heading: Chọn nền tảng
  pays_for_heading: Khoản ủng hộ được dùng cho
  pays_for:
    - Thời gian lập trình trình giả lập và mã máy chủ
    - Nghiên cứu giao thức và định dạng tệp
    - Công cụ mod và tài liệu
  not_for_heading: Không dùng cho
  not_for:
    - Vận hành máy chủ công khai
    - Quyền truy cập phần mềm, vật phẩm trong game hay đặc quyền khác
  faq_heading: Trước khi ủng hộ
  faq:
    - question: ILPAL có phải tổ chức phi lợi nhuận không?
      answer_html: "ILPAL dự định hoạt động theo mô hình phi lợi nhuận. [TÌNH TRẠNG PHÁP LÝ VÀ QUỐC GIA]. Đừng mặc định khoản ủng hộ được khấu trừ thuế nếu trang này không nêu rõ."
    - question: ILPAL có liên quan đến nhà phát hành gốc không?
      answer_html: Không. ILPAL là tổ chức độc lập, không liên kết với chủ sở hữu bản quyền của các phần mềm được nghiên cứu.
    - question: Ai điều hành ILPAL?
      answer_html: Xem %about% để biết về đội ngũ, tình trạng pháp lý và cách sử dụng quỹ.
    - question: Tôi có thể giúp mà không cần ủng hộ tiền không?
      answer_html: Có. Mã nguồn, kiểm thử và tài liệu đều rất hữu ích. Hãy bắt đầu từ %github%.

